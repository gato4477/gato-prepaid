<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가토선불폰 블로그 관리자</title><link rel="stylesheet" href="/blog/style.css"><style>body{background:#fff;color:#222}main{max-width:1000px;margin:25px auto;padding:0 18px}label{display:block;margin:15px 0 7px;font-weight:700}input,textarea{box-sizing:border-box;width:100%;padding:14px;border:1px solid #dfe4f4;border-radius:10px;font:inherit}.panel{padding:20px;border:1px solid #e3e8f5;border-radius:16px}.tabs,.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-top:18px}.tabs button{flex:1;padding:15px;border:1px solid #e2e7f3;background:#f2f3f7;color:#667080;font-weight:700}.tabs button.active{background:#4eb9e5;color:#fff}.toolbar{padding:10px;background:#f7f9fe;border:1px solid #e0e6f5}.toolbar button,.toolbar select{padding:8px 10px;background:#fff;border:1px solid #dce3f2;border-radius:8px;cursor:pointer}#editor{min-height:350px;padding:22px;border:1px solid #e0e6f5;outline:none;line-height:1.85;overflow-wrap:anywhere}#editor img{max-width:100%;height:auto}#editor table{border-collapse:collapse;width:100%}#editor td,#editor th{border:1px solid #ddd;padding:8px}#html{min-height:350px;font:14px/1.6 monospace;border-radius:0}#preview{padding:22px;border:1px solid #e0e6f5;min-height:250px;line-height:1.85;overflow-wrap:anywhere}#preview img{max-width:100%;height:auto}.hidden{display:none!important}.actions{margin-top:20px}.actions button{flex:1;padding:17px;border:0;border-radius:12px;background:#4eb9e5;color:white;font-weight:700;cursor:pointer}.actions button.secondary{background:#ff6932}.row{display:flex;gap:12px;align-items:center}.row input{width:auto}#msg{white-space:pre-wrap}.hint{color:#64748b;font-size:13px}button:disabled{opacity:.5}</style></head><body><header><a href="/">← 사이트</a>　<a href="/blog/">블로그 보기</a></header><main><h1>새 글 작성</h1><div class="panel"><label for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="off"><label for="title">제목</label><input id="title" placeholder="제목을 입력하세요"><label for="slug">글 주소 (자동 생성)</label><input id="slug" placeholder="제목을 입력하면 자동 생성됩니다"><p class="hint">제목을 입력하면 영문·숫자 주소가 자동으로 만들어집니다. 직접 수정할 수도 있어요.</p><label for="summary">소개글</label><input id="summary" placeholder="목록에 표시할 짧은 설명"><div class="tabs"><button type="button" class="active" data-tab="visual">✏️ 일반 편집</button><button type="button" data-tab="html">&lt;/&gt; HTML 붙여넣기</button><button type="button" data-tab="preview">👁 미리보기</button></div><div id="visual-pane"><div class="toolbar"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="underline"><u>U</u></button><select id="block"><option value="p">본문</option><option value="h2">큰 제목</option><option value="h3">작은 제목</option></select><button type="button" data-cmd="insertUnorderedList">• 목록</button><button type="button" data-cmd="insertOrderedList">1. 목록</button><button type="button" id="link-btn">🔗 링크</button><button type="button" id="image-btn">🖼 이미지</button><button type="button" data-cmd="insertHorizontalRule">― 구분선</button></div><div id="editor" contenteditable="true" aria-label="블로그 본문 편집기"></div></div><div id="html-pane" class="hidden"><textarea id="html" spellcheck="false" placeholder="<h2>제목</h2><p>본문을 입력하세요.</p>"></textarea></div><div id="preview-pane" class="hidden"><div id="preview"></div></div><label for="images">본문 이미지 (여러 장 선택)</label><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><label for="cover">썸네일 이미지 (선택)</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="row"><label><input id="published" type="checkbox" checked> 바로 발행</label></div><div class="actions"><button id="submit" type="button">저장 · 발행</button><button id="notice" class="secondary" type="button">📌 공지로 올리기</button><button id="reset" type="button" style="flex:0 0 auto;background:#e9ecf2;color:#606a79">초기화</button></div><p id="msg" role="status"></p></div></main><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="/admin/admin.js"></script></body></html>
