<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가토선불폰 블로그 관리자</title><link rel="stylesheet" href="/blog/style.css"><style>main{max-width:860px}label{display:block;margin:16px 0 5px;font-weight:bold}textarea,input{box-sizing:border-box;width:100%;padding:12px}textarea{min-height:300px;font-family:monospace}.panel{padding:20px;background:#f2f9ff;border-radius:14px;margin:16px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row input{width:auto}.hint{color:#566b7b}#msg{white-space:pre-wrap}button{cursor:pointer;padding:12px 22px}img{max-width:100%}</style><header><a href="/">← 사이트</a>　<a href="/blog/">블로그 보기</a><h1>블로그 관리자</h1><p>HTML 소스를 붙여넣고 이미지를 첨부하세요.</p></header><main><div class="panel"><label>관리자 비밀번호</label><input id="password" type="password" autocomplete="off" placeholder="Netlify에서 설정한 관리자 비밀번호"><label>글 제목</label><input id="title" placeholder="제목 입력"><label>글 주소 (영문·숫자 권장)</label><input id="slug" placeholder="prepaid-guide"><label>소개글</label><input id="summary" placeholder="블로그 목록에 표시할 짧은 소개"><label>HTML 소스</label><textarea id="html" placeholder="<h2>제목</h2><p>본문 내용</p><img src='photo1.jpg'>"></textarea><p class="hint">사진을 본문 원하는 위치에 넣으려면 HTML에 &lt;img src="사진파일명.jpg"&gt;을 적으세요. 사용하지 않은 첨부 사진은 본문 아래에 추가됩니다.</p><label>본문 이미지 (여러 장 선택)</label><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><label>썸네일 이미지 (선택)</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="row"><label><input id="published" type="checkbox" checked> 바로 발행</label></div><button id="submit">글 저장하기</button><p id="msg" role="status"></p></div></main><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="/admin/admin.js"></script></html>
