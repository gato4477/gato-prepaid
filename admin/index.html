<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가토선불폰 블로그 관리자</title><link rel="stylesheet" href="/blog/style.css"><style>main{max-width:850px}.panel{padding:18px;background:#f3faff;border:1px solid #d8eaf5;border-radius:15px;margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row button{margin:6px 0}.muted{color:#61768a}.error{color:#ac2433;white-space:pre-wrap}.ok{color:#16734b}.entry{border-bottom:1px solid #e0ebf2;padding:12px 0}.entry button{margin-left:10px}.hidden{display:none}textarea{min-height:100px}input[type=checkbox]{width:auto}#html-source{width:100%;min-height:320px;font-family:monospace;white-space:pre;tab-size:2}#preview{border:1px solid #c8dce9;width:100%;height:360px;background:white;border-radius:12px}.image-list{font-size:13px;color:#526b7c;white-space:pre-line}.help{font-size:13px;line-height:1.7}</style></head><body><header><a href="/">← 사이트</a>　<a href="/blog/">블로그 보기</a><h1>블로그 관리자</h1><p>HTML 소스를 붙여넣고 사진을 첨부해 발행하세요.</p></header><main><div id="setup" class="panel hidden">먼저 Supabase 연결 설정이 필요합니다.</div><section id="login" class="panel hidden"><h2>관리자 로그인</h2><label>이메일</label><input id="email" type="email" autocomplete="username"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"><p><button id="sign-in">로그인</button></p><div id="login-message" class="error"></div></section><section id="editor" class="hidden"><div class="row"><b id="account"></b><button id="sign-out">로그아웃</button></div><div class="panel"><h2>새 글 작성</h2><label for="title">제목</label><input id="title" placeholder="블로그 글 제목"><label for="slug">글 주소 (영문 권장)</label><input id="slug" placeholder="prepaid-guide"><label for="summary">소개글 (선택)</label><textarea id="summary" rows="2"></textarea><label for="html-source">HTML 소스 붙여넣기</label><textarea id="html-source" spellcheck="false" placeholder="<h2>소제목</h2>&#10;<p>본문 내용을 입력하세요.</p>&#10;<img src=&quot;photo1.jpg&quot; alt=&quot;사진&quot;>"></textarea><p class="help muted">사진을 본문 원하는 위치에 넣으려면 HTML에 &lt;img src="사진파일명.jpg"&gt;를 쓰고 같은 이름의 파일을 아래에서 첨부하세요. HTML에 사진 표시가 없으면 첨부한 사진은 글 맨 아래에 순서대로 추가됩니다.</p><label for="body-images">본문 사진 여러 장 첨부</label><input id="body-images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><p id="image-count" class="image-list">선택된 이미지 없음</p><label for="cover">썸네일 이미지 (선택)</label><input id="cover" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><details><summary>기존 HTML / ZIP 파일 불러오기 (선택)</summary><p class="muted">기존 파일을 가져오면 HTML 소스 칸에 채워집니다.</p><input id="file" type="file" accept=".html,.htm,.zip"></details><p><button id="preview-button" type="button">미리보기</button></p><iframe id="preview" title="블로그 글 미리보기" sandbox=""></iframe><p><label><input id="published" type="checkbox" checked> 바로 발행</label></p><div class="row"><button id="publish">저장 및 발행</button><span id="progress" class="muted"></span></div><div id="message" class="error" role="status"></div></div><h2>등록된 글</h2><div id="entries"></div></section></main><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script type="module" src="/admin/admin.js"></script></body></html>
