<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가토선불폰 블로그 관리자</title><link rel="stylesheet" href="/blog/style.css"><style>main{max-width:850px}.panel{padding:18px;background:#f3faff;border:1px solid #d8eaf5;border-radius:15px;margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row button{margin:6px 0}.muted{color:#61768a}.error{color:#ac2433;white-space:pre-wrap}.ok{color:#16734b}.entry{border-bottom:1px solid #e0ebf2;padding:12px 0}.entry button{margin-left:10px}.hidden{display:none}textarea{min-height:100px}input[type=checkbox]{width:auto}#preview{border:1px solid #c8dce9;width:100%;height:300px;background:white}</style></head><body><header><a href="/">← 사이트</a>　<a href="/blog/">블로그 보기</a><h1>블로그 관리자</h1><p>HTML 또는 HTML과 이미지가 들어 있는 ZIP 파일을 업로드하세요.</p></header><main><div id="setup" class="panel hidden">먼저 Supabase 연결 설정이 필요합니다. 동봉된 <b>설치안내.txt</b>를 확인하세요.</div><section id="login" class="panel hidden"><h2>관리자 로그인</h2><label>이메일</label><input id="email" type="email" autocomplete="username"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"><p><button id="sign-in">로그인</button></p><div id="login-message" class="error"></div></section><section id="editor" class="hidden"><div class="row"><b id="account"></b><button id="sign-out">로그아웃</button></div><div class="panel"><h2>새 글 업로드</h2><p class="muted">ZIP 파일은 HTML 1개와 이미지 파일들을 같은 폴더에 넣어 압축하세요. 이미지 파일 이름을 HTML의 src에 적어주세요.</p><label>HTML 또는 ZIP 선택</label><input id="file" type="file" accept=".html,.htm,.zip"><label>제목</label><input id="title" placeholder="파일을 선택하면 자동으로 읽어옵니다"><label>주소(영문 권장)</label><input id="slug" placeholder="prepaid-guide"><label>소개글 (선택)</label><textarea id="summary" rows="2"></textarea><label>썸네일 이미지 (선택)</label><input id="cover" type="file" accept="image/*"><p><label><input id="published" type="checkbox" checked> 바로 발행</label></p><div class="row"><button id="publish">업로드 및 저장</button><span id="progress" class="muted"></span></div><div id="message" class="error"></div></div><h2>등록된 글</h2><div id="entries"></div></section></main><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script type="module" src="/admin/admin.js"></script></body></html>
