<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가토선불폰 블로그 관리자</title><link rel="stylesheet" href="/blog/style.css"><style>main{width:min(100% - 32px,1000px)!important;max-width:1000px!important;margin:24px auto!important;padding:26px!important;min-height:0!important}body{background:#f5faff!important}header{max-width:1000px!important;margin:auto!important} .panel{width:100%;box-sizing:border-box}label{display:block;margin:15px 0 6px;font-weight:700}input,textarea{width:100%;padding:12px;box-sizing:border-box}textarea{min-height:360px;font-family:monospace}.panel{padding:22px;background:#f4f9ff;border-radius:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row input{width:auto}button{cursor:pointer;padding:12px 18px;border:0;border-radius:8px}.tabs{display:flex;gap:8px;margin-top:16px}.tabs button.active{background:#45b9e7;color:#fff}.editor{min-height:350px;padding:18px;border:1px solid #c8dce9;background:#fff;overflow-wrap:anywhere}.editor img{max-width:100%;height:auto}#preview{min-height:350px;border:1px solid #c8dce9;background:#fff;width:100%}#msg{white-space:pre-wrap}.hint{color:#566b7b;font-size:13px}.post-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #dbe7ef;padding:10px 0}.post-row button{flex-shrink:0}</style></head><body><header><a href="/">← 사이트</a>　<a href="/blog/">블로그 보기</a><h1>블로그 관리자</h1></header><main><section class="panel"><label>관리자 비밀번호</label><input id="password" type="password" autocomplete="off" placeholder="Netlify 관리자 비밀번호"><h2>글 관리</h2><button type="button" id="loadPosts">등록된 글 불러오기</button><div id="postList"></div><hr><h2 id="formHeading">새 글 작성</h2><label>제목</label><input id="title" placeholder="제목"><label>글 주소 (자동 생성)</label><input id="slug" placeholder="prepaid-guide"><label>소개글</label><input id="summary" placeholder="목록에 표시할 소개"><div class="tabs"><button class="active" type="button" data-tab="visual">일반 편집</button><button type="button" data-tab="source">HTML 붙여넣기</button><button type="button" data-tab="preview">미리보기</button></div><div id="visual" class="editor" contenteditable="true" aria-label="본문 일반 편집"></div><textarea id="html" style="display:none" placeholder="HTML 코드를 붙여넣으세요"></textarea><iframe id="preview" title="글 미리보기" sandbox="" style="display:none"></iframe><p class="hint">HTML 붙여넣기 후 일반 편집 탭을 누르면 글이 실제 모양으로 표시됩니다.</p><label>본문 이미지 (여러 장)</label><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><label>썸네일 이미지</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="row"><label><input id="published" type="checkbox" checked> 발행</label></div><div class="row"><button id="submit" type="button">저장 · 발행</button><button id="newPost" type="button">새 글 작성</button></div><p id="msg" role="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="/admin/admin.js"></script></body></html>
