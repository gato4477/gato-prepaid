<!-- 메인 index.html의 원하는 위치, 예: 푸터 바로 위에 삽입 -->
<section id="latestBlog" style="max-width:1100px;margin:48px auto;padding:20px">
  <h2 style="font-size:26px">가토선불폰 최신 블로그</h2>
  <div id="latestBlogCards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px"></div>
  <p><a href="/blog/">블로그 글 더보기 →</a></p>
</section>
<script>
(async()=>{try{const r=await fetch('/blog/posts.json');if(!r.ok)return;const list=(await r.json()).filter(p=>p.published).slice(0,3);const box=document.getElementById('latestBlogCards');for(const p of list){const a=document.createElement('a');a.href='/blog/post.html?slug='+encodeURIComponent(p.slug);a.style.cssText='display:block;text-decoration:none;color:#20364a;border:1px solid #dbeaf5;border-radius:15px;overflow:hidden';if(p.cover_path){const img=document.createElement('img');img.src=p.cover_path;img.alt='';img.style.cssText='width:100%;aspect-ratio:16/9;object-fit:contain;background:#f3f8fc';a.append(img)}const h=document.createElement('h3');h.textContent=p.title;h.style.cssText='font-size:17px;line-height:1.5;padding:0 16px';a.append(h);box.append(a)}}catch(e){}})();
</script>
