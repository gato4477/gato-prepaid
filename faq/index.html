</style></head><body><div class="wrap"><nav class="nav"><a href="/">← 가토선불폰 홈으로</a></nav><section class="heading"><h1>자주 묻는 질문</h1><p>궁금한 내용을 검색하거나 질문을 선택해 확인하세요.</p></section><input class="search" id="search" type="search" placeholder="예: 미납, 유심, 인증서, 요금제" aria-label="질문 검색"><div class="tabs" id="tabs"></div><div class="list" id="list"></div></div><script>
const data=[{"q": "휴대폰 요금이 미납돼도 선불폰을 쓸 수 있나요?", "a": "선불 신규개통은 이전 통신사 요금이 미납된 상태에서도 가능합니다. 다만 기존 번호는 유지할 수 없으며, 새로운 번호로 개통됩니다.", "url": "faq/guide-01.html", "c": "개통"}, {"q": "지금 쓰는 휴대폰을 그대로 사용할 수 있나요?", "a": "휴대폰이 정상적으로 작동한다면 기존 기기를 그대로 사용할 수 있습니다. 다만 KT 요금 미납으로 정지된 단말기는 KT망 유심 인식 오류가 발생할 수 있어 LG망 이용을 권장합니다. LG·SK 요금 미납 단말기는 KT망과 LG망 모두 이용할 수 있습니다.", "url": "faq/guide-02.html", "c": "유심"}, {"q": "유심만 사서 끼우면 바로 되나요?", "a": "아니요. 유심을 준비한 뒤 본인확인과 개통 신청이 완료되어야 통신 서비스를 사용할 수 있습니다.", "url": "faq/guide-03.html", "c": "유심"}, {"q": "온라인 개통 시간은 언제인가요?", "a": "앤텔레콤 기준 신규개통은 매일 08:00~21:50, 번호이동은 월~토 10:00~19:50이며 일요일·공휴일 번호이동은 진행되지 않습니다.", "url": "faq/guide-04.html", "c": "개통"}, {"q": "KT,LG 대리점에서도 개통이 가능한가요?", "a": "안타깝게도 일반 KT, LG 대리점에서는 개통이 어렵습니다. 다만 전국에 앤텔레콤 대리점이 운영되고 있기 때문에, 담당자를 통해 가까운 지점을 안내받은 뒤 방문 개통으로 진행할 수 있습니다.", "url": "faq/q-001.html", "c": "가입"}, {"q": "가입정보는 어디서 확인할 수 있나요?", "a": "앤텔레콤 멤버십 앱 또는 고객센터(114 무료, 1899-7700 유료)를 통해 확인 가능합니다.", "url": "faq/q-002.html", "c": "가입"}, {"q": "유심은 어디서 구매하나요?", "a": "N플랫폼 홈페이지 내부에 있는 유심구매를 이용하시거나\nK망: 바로배송 유심 (K망 멤버쉽 어플), 바로유심 (이마트24, CU, GS25)      L망: 모두의 원칩 (이마트24, B마트, 지하철 역 자판기, 온라인 쇼핑 채널 등)\n에서 구매가능합니다.", "url": "faq/q-003.html", "c": "가입"}, {"q": "타 통신사 단말기도 사용할 수 있나요?", "a": "단말기에 문제가 없을 경우, 최소 전원을 2~3회 이상 (1분정도 여유) 껐다 켜시면 사용이 가능 합니다.\n\n단, 일부 단말기는 USIM 이동이 일부 제한될 수 있습니다.\n\n\n\n- 2013년 11월 이전 출시된 LG U+ 단말\n\n- 2014년 09월 이후 출시된 3G 및 LTE 이용 가능 (VOLTE 사용 포함)", "url": "faq/q-004.html", "c": "가입"}, {"q": "USIM만 다른 단말기에 장착하여 사용하던 번호를 그대로 다른 단말기에서 쓸 수 있나요?", "a": "대리점방문을 통한 기기변경 절차 없이 이용 중인 휴대폰에 다른 USIM을 장착하여 사용하거나,  본인의 USIM을 다른 핸드폰에 장착 후 재부팅 2~3번하면 사용 가능합니다. \n\n다만, 재부팅을 했음에도 이용이 불가할 경우 고객센터를 통해 문의 부탁 드립니다.  \n\n\n\n■ 고객센터 이용안내\n\n- 앤텔레콤 휴대폰에서 114(무료), 타사 이용 시 1899-7700(유료)\n\n- 운영시간 : 평일 09:30~18:00 , 토/일/ 공휴일 휴무", "url": "faq/q-005.html", "c": "가입"}, {"q": "앤텔레콤에서 다른 통신사로 가입되었다는 문자가 왔어요.", "a": "명의도용방지서비스(M-safer)'라는 문자로 유/무선 신규가입(번호이동/명의변경 가입 포함) 발생 시,\n\n새로운 회선이 가입이 발생된 사실을 기 개통된 핸드폰에 문자안내하거나, 우편안내하여 명의도용을 방지하기 위한 문자발송 입니다.", "url": "faq/q-006.html", "c": "가입"}, {"q": "유심만 있으면 단말기 없이 개통 가능한가요?", "a": "네, 단말기 없이 유심단독 개통이 가능합니다.", "url": "faq/q-007.html", "c": "가입"}, {"q": "일시정지 가능한가요?", "a": "연간 일시정지는 1회 최대 90일 정지가 가능하며 년 2회 가능합니다.\n\n단, 발신정지는 30일만 가능하며, 30일 이후 자동 발착신정지로 변경됩니다.\n\n\n\n공통적으로 후불 요금제의 경우 고객센터를 통해 일시정지, 일시정지해제가 가능하며,\n\n선불의 경우 LG는 일시정지불가, KT는 앤텔레콤 멤버십 K망으로 가능합니다(일시정지 해제는 고객센터로만 가능)", "url": "faq/q-008.html", "c": "정지"}, {"q": "MVNO가 무엇인가요?", "a": "MVNO는 기존 이통3사(SKT,KT,LGU+)의 통신망을 임대하여 이통 3사와 동일한 통화품질을 제공하는 서비스를 말합니다.", "url": "faq/q-009.html", "c": "기타"}, {"q": "해지는 어떻게 신청하면 되나요?", "a": "앤텔레콤 고객센터\n\n[모바일] 앤텔레콤 전화 + 114 (무료) / 타통신사 1899-7700(유료)\n평일 09:30~18:00 , 토/일/ 공휴일 휴무\n\n로 문의바랍니다.", "url": "faq/q-010.html", "c": "기타"}, {"q": "본인인증할 통신사는 어디를 선택해야하나요?", "a": "업체에 따라 다르지만, 기본적으로 K망이시면 알뜰폰 - KT 로, L망이시면 알뜰푠 - LG로 선택 가능합니다.\n\n만약 알뜰폰이 통신사 목록에 없는 경우, 번거로우시겠지만 본인 인증 업체로 문의 부탁드립니다.", "url": "faq/q-011.html", "c": "기타"}, {"q": "테더링(핫스팟)이 가능한가요?", "a": "이용 시 참고사항  \n\n· 단말기에서 테더링(핫스팟) 활성화 시 이용 가능  \n\n· LTE 요금제의 경우 제공된 요금제의 데이터 제공량 내에서 사용 가능하며, 제공혜택 초과 시 추가요금 발생", "url": "faq/q-012.html", "c": "기타"}, {"q": "고객센터(1899-7700(유료), 앤텔레콤 핸드폰에서 114(무료)) 이용 시 주말이나 야간에도 상담원 연결이 가능한가요?", "a": "공교롭게도 평일만 상담 가능합니다.\n\n■ 고객센터 이용안내\n\n  - 앤텔레콤 휴대폰에서 114(무료), 타사 이용 시 1899-7700(유료)\n\n  - 운영시간 : 평일 09:30~18:00 , 토/일/ 공휴일 휴무\n\n■ 가토통신 고객센터 이용안내\n  - 개통하면서 매칭 된 담당자와의 상담은 365일 가능합니다.\n  - 카톡 ID : gato4477 \n  - 카톡채널 : 가토\n  - 연락처 : 010-4316-4477", "url": "faq/q-013.html", "c": "기타"}, {"q": "무제한 & 기본제공의 경우 제한이 별도 없나요?", "a": "무제한요금제의 기본제공은 부가/영상통화가 별도 제공 됩니다.\n\n요금제 별 제공량은 상이하며, 1577, 1588 등 회사 대표전화로 전화를 하거나 영상통화를 사용 시  제공량까지만 무료로 이용이 가능하며 초과 사용 시 추가요금이 발생됩니다.\n\n또한, 약관을 위반한 영리 목적으로 사용이 간주되는 경우 요금이 추가 발생할 수 있습니다", "url": "faq/q-014.html", "c": "기타"}, {"q": "분실폰 위치 찾기 가능한가요?", "a": "안타깝게도 분실폰 위치 찾기 서비스 제공을 하지 않고 있습니다.\n\n다만 분실폰 찾기에 도움이 될만한 사이트는 아래 참고 부탁 드립니다.  \n\n\n\n○ 구글 \"내 기기 찾기\" : 구글 포탈에서 검색 후 계정 로그인\n\n○ 삼성 디바이스 찾기 : https://findmymobile.samsung.com/\n\n○ 애플 아이클라우드 : https://www.apple.com/kr/icloud/\n\n○ 경찰청 유실물 종합안내 : https://www.lost112.go.kr/\n\n○ 핸드폰 찾기 콜센터 : https://www.handphone.or.kr/\n\n○ 서울시 대중교통 통합분실물 센터 : https://www.seoul.go.kr/v2012/find.htm", "url": "faq/q-015.html", "c": "기타"}, {"q": "부가통화가 뭔가요?", "a": "요금제의 통화 기본제공 범위에 포함되지 않는 영상통화, 부가 통화를 위해 제공되는 통화를 의미합니다.  \n\n\n\n■ 전국 대표번호 (1588,1577,02-1588등), 전화정보서비스(060,700등), TRS(013), 국내영상통화, 개인번호 서비스(050)에 거는 전화는 월 제공 부가통화에서 차감  \n\n\n\n기본제공 요금제의 경우 부가통화가 별도로 제공 되고 있습니다.  \n\n\n\n또한, 약관을 위반한 영리 목적으로 사용이 간주되는 경우 요금이 추가 발생 할 수 있으니 참고 부탁드립니다.", "url": "faq/q-016.html", "c": "기타"}, {"q": "(L)LGU+ 공용 와이파이는 이용이 가능한가요?", "a": "LGU+ 공용 와이파이는 사용 가능합니다. 단, 선불의 경우 공용 와이파이는 사용 불가합니다.", "url": "faq/q-017.html", "c": "기타"}, {"q": "휴대폰 소액결제가 가능한가요?", "a": "선불의 경우는 소액결제 사용 불가하며, 후불은 사용 가능합니다.", "url": "faq/q-018.html", "c": "기타"}, {"q": "해외출국 시 자동로밍이 이용가능한가요?", "a": "선불요금제인 경우 LG는 로밍이용불가 , KT인 경우 고객센터(앤텔레콤 휴대폰 + 114 (무료) 타 통신사 1899-7700 (유료)) 혹은 앤텔레콤 멤버십 K망에서 접수 가능하시며,\n\n후불요금제인경우 KT,LG와 동일한 제휴국가에서 이용 가능하며, 해외 방문 국가에 도착 후에 휴대폰 전원을 On/Off 후 이용 부탁드립니다.\n\n국내에서 사용 중인 요금제, 부가서비스의 무료 제공 혜택은 로밍 시 적용되지 않습니다.", "url": "faq/q-019.html", "c": "로밍"}, {"q": "(L)선불 국제전화 이용이 가능 한가요? 방법과 비용은 어떻게 되나요?", "a": "선불의 경우 국제전화는 002만 사용 가능합니다. 방법은 002 + 국가번호 + 상대방 휴대전화번호(휴대번호 ‘0’제외) / 002 + 국가번호 + 지역번호 + 상대방 전화번호(지역번호 ‘0’제외’) -> 통화 이며, 비용은 국가에 따라 다릅니다.", "url": "faq/q-020.html", "c": "로밍"}, {"q": "기기변경을 하고 싶어요.", "a": "유심 장착 후 재부팅 2~3번 진행 시 사용 가능합니다. \n\n재부팅 이후에도 사용되지 않을경우 IMEI 확인 후 고객센터를 통해 문의 부탁드립니다.\n\n(단말기에서 IMEI 확인 방법 : 키패드 → *#06# 입력)\n\n\n\n■ 고객센터 이용안내\n\n- 앤텔레콤 휴대폰에서 114(무료), 타사 이용 시 1899-7700(유료)\n\n- 운영시간 : 평일 09:30~18:00 , 토/일/ 공휴일 휴무", "url": "faq/q-021.html", "c": "변경"}, {"q": "명의변경을 하고 싶습니다. 어떻게 해야 하나요?", "a": "일반요금제일 경우 명의변경이 가능하며, 약정요금제는 명의변경이 불가합니다.\n- 가족 간 또는 가족관계 변동 (사망, 군입대, 이민, 이혼, 파양, 개명, 실사용자 등)에 따른 명의변경\n- 법인 상호 간 사업 양도, 양수, 합병 또는 동일 법인 단순 상호변경에 따른 명의변경\n- 개인가입자의 법인 입사, 퇴사에 따른 명의변경 (단, 개인과 법인 상호 간의 명의변경 횟수는 3개월에 1회로 제한)\n위 경우에만 명의변경이 가능하며, 개통 3개월 경과 후 구비서류 지참하고 앤텔레콤 센터 내방 하셔야합니다.\n단, 최근 3개월간 연속해서 통화량이 없는 경우 명의 변경 불가합니다.", "url": "faq/q-022.html", "c": "변경"}, {"q": "요금제를 변경하려면 어떻게 해야 하나요?", "a": "고객센터 혹은 앤텔레콤 멤버십 앱에서 셀프케어, 요금제 변경접수가 가능합니다", "url": "faq/q-023.html", "c": "변경"}, {"q": "번호변경은 어떻게 해야 하나요?", "a": "멤버십 앱을 활용하시거나 가까운 앤텔레콤 센터로 신분증 지참하시어 방문하여 접수 바랍니다.", "url": "faq/q-024.html", "c": "변경"}, {"q": "명의변경은 어떻게 하나요?", "a": "가까운 앤텔레콤 센터에서만 접수가능하며, 조건 및 구비서류가 필요합니다.\n\n※ 명의변경 필수 조건\n\n개인↔개인 : 직전 연속 3개월 사용량O + 가족에 한해 가능\n\n개인↔법인 : 직전 연속 3개월 사용량O + 법인 구성원인 개인의 입/퇴사의 경우에 한해 가능\n\n법인↔법인 : 직전 연속 3개월 사용량O + 법인 간 사업 양/수도, 합병 및 상호변경의 경우에 한해 가능\n\n\n\n명의변경 시 구비서류(양도/양수인 신분증, 가족관계증명서, 명의변경신청서 등)  제출이 필요합니다.\n\n\n\n자세한 내용은 고객센터에 문의바랍니다.\n\n\n\n고객센터\n\n휴대폰에서 114(무료), 타사 이용 시 1899-7700(유료) - 운영시간 : 평일 09:30~18:00 , 토/일/ 공휴일 휴무", "url": "faq/q-025.html", "c": "변경"}, {"q": "기기변경 시 가입비와 유심비용이 청구되나요?", "a": "가입비는 청구되지 않으며, 유심비는 기존 기기와 변경 기기의 규격이 맞지 않아 새로 구매하셔야 할 경우 비용이 청구되실 수 있습니다.", "url": "faq/q-026.html", "c": "변경"}, {"q": "(L)LGU+ 직영대리점에서 가능한 업무는 어떻게 되나요 ?", "a": "번호변경, 명의변경, 확정기변 등 서비스변경이 가능하며 요금납부(카드수납), 분실신고 등 기타 업무도 가능합니다", "url": "faq/q-027.html", "c": "변경"}, {"q": "(K)KT Wi-Fi에 접속이 되지 않습니다.", "a": "타 통신사향 단말기, 해외구매 단말기, 자급제 단말기의 경우에는 단말기 MAC 주소(Wi-Fi 주소) 를 확인하셔서 고객센터로 문의 부탁 드립니다.   \n\n■ MAC주소 확인 방법\n\n- 안드로이드(Wi-Fi ON) : 설정 → 휴대폰 정보 → 상태 정보 → 휴대전화 Wi-Fi MAC 주소\n\n- 아이폰 : 설정 → 일반 → 정보  \n\n■ 고객센터 이용안내\n\n- 앤텔레콤 휴대폰에서 114(무료), 타사 이용 시 1899-7700(유료)\n\n- 운영시간 : 평일 09:30~18:00 , 토/일/ 공휴일 휴무", "url": "faq/q-029.html", "c": "부가서비스"}, {"q": "통화 중 전화가 걸려오면 현재 통화 중인 전화를 잠시 대기 시키고 새로 걸려온 전화를 받을 수 있는 서비스가 있나요?", "a": "KT의 경우\n'통화중대기'서비스이며, 간단하게 휴대폰에서 설정/해제 가능합니다.\n[설정방법] * + 40 + 통화\n[해제방법] * + 400 + 통화\n\n\n\nLG의 경우\n\n선불은 앤텔레콤 멤버십L망 앱에서, 후불은 U+모바일매니저 앱을 통해 직접 설정/해제 가능합니다.", "url": "faq/q-030.html", "c": "부가서비스"}, {"q": "(L)통화연결음 음원설정은 어떻게 다운 받아야 하나요?", "a": "선불은 음원사용이 불가합니다. 후불은 필링 서비스 가입 후 설정 가능합니다. www.musicbellring.com 에서 설정가능합니다.", "url": "faq/q-031.html", "c": "부가서비스"}, {"q": "(L)선불 부가서비스 비용은 어떻게 결제를 하면 되나요?", "a": "선불의 경우 기본 사용료(월차감) 외 추가충전을 하셔야 사용가능합니다. 최소 충전 단위는 5천원 이상(백원 단위가능) 부가서비스 사용 금액이 일차감으로 계산되어 차감됩니다.", "url": "faq/q-032.html", "c": "부가서비스"}, {"q": "타통신사에서 사용했던 유심카드가 있는데 그대로 사용할 수 있나요?", "a": "타통신사에서 사용하시던 유심은 앤텔레콤에서 재사용이 불가합니다.\n앤텔레콤에서만 이용가능한 유심으로 가능하며, 유심 구매방법은 하기와 같습니다.\n\n\n\n1)  플랫폼 홈페이지에서 유심구매\n\n2)  MVNO 공용 유심 구매처에서 유심구매 \n\n K망: 바로배송 유심 (K망 멤버쉽 어플), 바로유심 (이마트24, CU, GS25)      \n\n L망: 모두의 원칩 (이마트24, B마트, 지하철 역 자판기, 온라인 쇼핑 채널 등)", "url": "faq/q-033.html", "c": "셀프개통"}, {"q": "유심단독 개통이 무엇인가요?", "a": "단말기 구매 없이 유심칩만 구매하여, 기존 사용하시던 단말기 또는 소지한 사용 가능 단말기에 장착하여 이용하는 유심 전용 요금제를 의미합니다.\n\n\n타 통신사 이용 중이라도 번호이동으로 사용하시던 번호 그대로 이용이 가능합니다.", "url": "faq/q-034.html", "c": "셀프개통"}, {"q": "신규가입과 번호이동의 차이가 무엇인가요?", "a": "신규가입은 새로운 번호를 부여받아 개통하는 것을 의미합니다.\n\n\n번호이동은 타 통신사(SKT,KT,LGU+,타알뜰폰통신사) 이용 중이신 고객님께서 사용하시는 번호 그대로 앤텔레콤으로 통신사를 이동하는 것을 의미합니다.", "url": "faq/q-035.html", "c": "셀프개통"}, {"q": "이용중인 번호 그대로 사용할 수 있나요?", "a": "네 가능합니다.\n\n타 통신사(SKT,KT,LGU+,타알뜰폰통신사) 이용 중이신 고객님의 경우 현재 사용 중인 번호 그대로 번호이동을 통해 앤텔레콤에 가입 가능합니다.", "url": "faq/q-036.html", "c": "셀프개통"}, {"q": "개통은 완료되었는데 유심 인식이 안돼요.", "a": "휴대전화에 유심 장착 후 2~3회 이상 전원을 껐다 켜면 자동으로 유심이 인식됩니다. \n\n그래도 인식이 되지 않을 경우, \n\n유심개통 번호이동 후 유심 인식 안될 시\n\nKT 수동나밍  *147359*682*\nLG 수동나밍 #5487587#682#\n로 해주세요.\n\n수동나밍 후에도 유심 인식 안될 시 유심변경 또는 가까운 앤텔레콤 센터에 방문해주세요.", "url": "faq/q-037.html", "c": "셀프개통"}, {"q": "셀프개통은 누구나 다 가능한가요?", "a": "셀프개통 불가 대상자\n\n1. 외국인(여권)\n\n2. 미성년자\n\n3. 법인\n\n4. 타사 번호이동/신규가입/명의변경 3개월 이내 회선\n\n5. 30일 이내 앤텔레콤 번호를 해지하신 경우", "url": "faq/q-038.html", "c": "셀프개통"}, {"q": "야간이나 휴일에도 셀프개통이 가능한가요?", "a": "셀프개통이 가능한 시간은\n\n번호이동 10:00 ~ 19:50 / 신규가입 08:00 ~ 21:50 까지 가능합니다.\n\n(단, 번호이동 시 일요일/신정/설 추석 당일에는 셀프개통이 불가합니다.)\n\n당일까지 셀프개통 완료되지 못한 경우, 익일 새로 하셔야 됩니다.", "url": "faq/q-039.html", "c": "셀프개통"}, {"q": "번호이동으로 가입하면 이전 통신사 해지는 어떻게 하나요?", "a": "이전 통신사는 번호이동이 완료 직전에 자동으로 해지 됩니다.\n이전 통신사에서 정산되지 않은 요금은 앤텔레콤 청구서에 합산 되어 청구 됩니다.  \n\n(단, 휴대폰 잔여 할부금이 남아 있는 경우, 할부금은 이전 통신사에서 청구 됩니다.)", "url": "faq/q-040.html", "c": "셀프개통"}, {"q": "유심개통 후 휴대폰에 정착했는데 인식이 안됩니다.", "a": "[개통 후 'SIM 카드 없음' 문구 팝업 : 유심을 인식하지 못하는 경우]\n\n1. 다른 공기계에 USIM 장착 후 동일 증상인지 확인  → 인식될 경우 사용하려는 단말기 IMEI 확인 후 고객센터 연락 필요\n\n2. 다른 공기계가 없는 경우, USIM 번호와 사용하려는 단말기의 IMEI 확인 후 고객센터 연락  \n\n※ IMEI 확인 방법 : 단말기 키패드 (전화번호 입력 화면) → *#06# 입력 → IMEI (숫자 15자리) 확인  \n\n\n\n[개통 후 '번호 등록에 실패하였습니다. 재시도 하시겠습니까?' 또는 '신호세기가 미약합니다.' 문구가 팝업 : 유심은 인식 되었으나, 번호 등록이 실패한 경우]\n\n1. 타 통신사 단말기(SKT/LGU+전용 단말기) or 자급제 단말기(삼성전자, LG베스트샵, 해외 직구매 등 직접 구매한 단말기)  \n\n 1 전원 ON/OFF 연속 3회~ 4회 시도      번호등록 팝업이 뜨면 ‘예’ 선택 후 번호등록 성공 팝업이 될 때까지 대기(5분 미만)  \n\n 2. KT,LG전용단말  \n\n  1 전원 ON/OFF 연속 3회~ 4회 시도      번호등록 팝업이 뜨면 ‘예’ 선택 후 번호등록 성공 팝업이 될 때까지 대기(5분 미만)  \n\n  2 나밍(naming) 진행(개통 완료 된 후 기지국과 연결, 단말기에 가입한 휴대폰 번호를 등록 하는 것)      \n\n    단말기 키패드(전화번호 입력 화면) → (KT) *147359*682* 입력 / (LG) #5487587#682# → 번호를 등록중입니다. 문구 팝업   \n\n→ ‘번호등록이 완료되었습니다. 리셋이 필요합니다.’ 라는 문구 팝업   \n\n→ 자동으로 전원 재부팅이 완료되면 정상적으로 사용 가능   위 방법을 진행한 후에도 번호등록 실패 시 고객센터로 문의해 주시기 바랍니다.\n\n■ 고객센터 이용안내  - 앤텔레콤 휴대폰에서 114(무료), 타사 이용 시 1899-7700(유료)  - 운영시간 : 평일 09:30~18:00 , 토/일/ 공휴일 휴무", "url": "faq/q-041.html", "c": "셀프개통"}, {"q": "셀프개통했는데 교통카드 이용이 안됩니다.", "a": "KT,LG전용 단말이 아니거나, 번호등록이 되지 않았을 경우, 또는 NFC유심이 아닌 일반유심일 경우에는 교통카드 이용이 되지 않습니다.  \n\n■ 상황별 처리방안  \n\n· NFC유심이 아닌 경우 : NFC 유심 구매 후 유심 변경 필요  \n\n· 번호등록이 되지 않았을 경우 : 전화 거는 화면에서 (KT) *147359*682* / (LG) #5487587#682# 입력 시 '번호를 등록 중입니다'. 라는 문구 팝업 → 정상적으로 번호등록 시에는 ‘번호등록이 완료되었습니다. 리셋이 필요합니다.’\n\n라는 문구가 화면에 출력되고 자동으로 전원 OFF/ON 이 완료되면 정상적으로 사용이 가능  \n\n\n\n위 방법을 진행한 후에도 번호등록 실패 시 고객센터로 문의 부탁 드립니다.  \n\n\n\n※ 삼성페이 내의 교통카드 기능 이용 시 에는 NFC 유심 사용이 필요합니다.", "url": "faq/q-042.html", "c": "셀프개통"}, {"q": "미성년자도 가입이 가능한가요?", "a": "가까운 앤텔레콤 센터로 보호자분께서 직접 구비서류 지참하시어 서류 접수를 통해 가능합니다.\n\n\n\n구비서류\n\n법정대리인이 직접 센터 내방시에는 법정대리인신분증, 가족관계확인서(발급받은지 3개월 이내), 미성년자 신분증, 고객본인확인서를 구비하면 됩니다.\n\n(대리인 내방시에는 법정대리인신분증, 인감증명서, 인감도장 날인된 위임장, 가족관계확인서(발급받은지 3개월 이내), 미성년자 신분증, 대리인신분증추가)", "url": "faq/q-043.html", "c": "셀프개통"}, {"q": "타 통신사에 요금체납이 있습니다. 후불 요금제 개통 가입이 가능한가요?", "a": "타 통신사 체납의 경우에는 개통이 불가합니다. 해당 통신사를 통하여 미납금액을 납부하여야 합니다.", "url": "faq/q-044.html", "c": "셀프개통"}, {"q": "신용불량자도 개통 가능한가요?", "a": "선불의 경우 타 통신사 미납이 있어도 개통 가능합니다. 단, 자사(앤텔레콤)미납의 경우 개통이 불가합니다.", "url": "faq/q-045.html", "c": "셀프개통"}, {"q": "번호이동 인증 실패 시 개통 불가능한가요?", "a": "번호이동 인증은 하루에 7회만 가능하며, 인증 오류 7회 초과 시 당일 번호이동은 불가능합니다.", "url": "faq/q-046.html", "c": "셀프개통"}, {"q": "데이터를 사용하지 않았는데 데이터통화료가 발생했어요.", "a": "스마트폰의 경우, 어플 업데이트 및 푸시 설정, 메일, 어플 알림 시에도 데이터 통화료가 발생 될 수 있으며, TV어플이나 신문어플등을 이용했을 경우 멀티태스킹을 종료하지 않으면 계속적으로 데이터 통화료가 발생 될 수 있어 사용에 주의가 필요합니다. (휴대폰으로 사진을 찍을때도 위치기반서비스가 켜져있다면 인터넷접속되어 데이터통화료가 발생될 수 있습니다.)", "url": "faq/q-047.html", "c": "요금"}, {"q": "월 중 요금제변경하면 요금은 어떻게 청구되나요?", "a": "월 중 요금제 변경 시 변경 전일까지 기본료 및 기본 제공량이 일할계산되고, 제공혜택 초과 시 추가요금이 발생됩니다.\n\n또한, 변경 시점부터 말일까지 기본료 및 기본제공량도 일할계산되어 청구 및 제공됩니다.  \n\n\n\n※변경 전 요금제의 제공량이 기본제공인 경우, 해당 제공항목은 추가요금이 부과되지 않습니다.\n\n(요금제 자체의 QoS기능이 있는 경우에도 추가요금 발생 없음, QoS부가서비스를 별도 가입한 경우는 추가요금 발생 가능)", "url": "faq/q-048.html", "c": "요금"}, {"q": "명세서 안 왔어요.", "a": "선불은 명세서 발행이 없으며, 후불의 경우 개통 당시 수령방법(MMS, 우편, 이메일) 통해 수령받으실 수 있으며, 분실하시거나 다시 받기를 원하는 경우 고객센터를 통해 재발행도 가능합니다.\n\n\n\n고객센터\n\n앤텔레콤 휴대폰 + 114 (무료), 1899-7700 (유료)\n\n운영시간 : 평일 09:30~18:00 , 토/일/ 공휴일 휴무", "url": "faq/q-049.html", "c": "요금"}, {"q": "영상통화를 사용한 적이 없는데 초과되었다고 문자가 왔습니다.", "a": "현재 발송되고 있는 초과 사용량 문자의 경우 음성 또는 영상통화료로 발송 되고 있습니다. 영상 통화를 사용하지 않았다면, 음성 통화로 인한 초과요금이 발생하지 않았는지 확인 부탁드립니다.", "url": "faq/q-050.html", "c": "요금"}, {"q": "잔액소진 후 미충전 시 사용이 불가한가요?", "a": "잔액 소진일로부터 15일간 수신은 가능하며, 15일이후 30일 경과시 직권해지 됩니다.", "url": "faq/q-051.html", "c": "요금"}, {"q": "개통 시 요금충전은 꼭 해야 하나요?", "a": "개통 당일까지 요금 충전이 되어야하며, 미충전 시 익일 번호 정지 및 해지가 될 수 있습니다.", "url": "faq/q-052.html", "c": "요금"}, {"q": "선불 기본료 충전과 차감은 어떻게 되나요?", "a": "K망(일차감 방식) 내가 충전한 금액에서 매일매일 하루치 요금이 빠져나갑니다.\nL망 (월차감 방식) 한 달치 요금을 미리 지불하고 사용하는 방식입니다.", "url": "faq/q-053.html", "c": "요금"}];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cat='전체';const cats=['전체',...new Set(data.map(x=>x.c||'기타'))];const tabs=document.getElementById('tabs'),list=document.getElementById('list'),search=document.getElementById('search');function render(){let q=search.value.trim().toLowerCase();tabs.innerHTML=cats.map(c=>`<button type="button" class="tab ${cat===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');let rows=data.filter(x=>(cat==='전체'||(x.c||'기타')===cat)&&(!q||(x.q+' '+x.a).toLowerCase().includes(q)));list.innerHTML=rows.length?rows.map(x=>`<details><summary>${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`).join(''):'<p class="empty">검색 결과가 없습니다. 다른 검색어로 찾아보세요.</p>'}tabs.addEventListener('click',e=>{let b=e.target.closest('button[data-cat]');if(b){cat=b.dataset.cat;render()}});search.addEventListener('input',render);list.addEventListener('toggle',e=>{const opened=e.target;if(!(opened instanceof HTMLDetailsElement)||!opened.open)return;list.querySelectorAll('details[open]').forEach(item=>{if(item!==opened)item.open=false;});},true);render();
</script></body></html>
