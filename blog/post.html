<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가토선불폰 블로그</title><link rel="stylesheet" href="/blog/style.css"></head><body><header><a href="/blog/">← 블로그 목록</a><h1 id="title">글 불러오는 중</h1><p id="meta"></p></header><main><p id="status"></p><iframe id="article" title="블로그 본문" sandbox="" style="display:none;width:100%;border:0;min-height:600px"></iframe></main><script>const slug=new URLSearchParams(location.search).get('slug');const status=document.getElementById('status');if(!slug||!/^[a-z0-9가-힣-]{1,80}$/.test(slug))status.textContent='글 주소가 올바르지 않습니다.';else fetch('/blog/posts/'+encodeURIComponent(slug)+'.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(p=>{if(!p.published)throw Error();document.title=p.title+' | 가토선불폰';document.getElementById('title').textContent=p.title;document.getElementById('meta').textContent=new Date(p.published_at).toLocaleDateString('ko-KR');const f=document.getElementById('article');f.style.display='block';f.srcdoc='<!doctype html><html lang="ko"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;color:#20364a;line-height:1.85;margin:0;padding:12px;overflow-wrap:anywhere}img{max-width:100%;height:auto}table{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto}td,th{border:1px solid #dce7ee;padding:9px}</style><body>'+p.body_html+'</body>';f.addEventListener('load',()=>{try{f.style.height=Math.max(600,f.contentDocument.body.scrollHeight+40)+'px'}catch{}})}).catch(()=>status.textContent='글을 찾을 수 없습니다.');</script></body></html>
