<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가토선불폰 블로그</title><link rel="stylesheet" href="/blog/style.css"></head><body><header><a href="/blog/">← 블로그 목록</a><h1 id="title">글 불러오는 중</h1><p id="meta"></p></header><main><div id="status"></div><iframe id="article" title="블로그 본문" sandbox="" style="display:none;width:100%;border:0;min-height:600px" loading="eager"></iframe></main><script type="module">import {client,ready,escapeHtml,dateString} from './common.js';const slug=new URLSearchParams(location.search).get('slug');const status=document.getElementById('status');if(!ready)status.textContent='블로그 연결 설정이 필요합니다.';else if(!slug)status.textContent='글 주소가 올바르지 않습니다.';else{const {data,error}=await client.from('blog_posts').select('title,body_html,published_at').eq('slug',slug).eq('published',true).maybeSingle();if(error||!data){status.textContent='글을 찾을 수 없습니다.'}else{document.title=data.title+' | 가토선불폰';document.getElementById('title').textContent=data.title;document.getElementById('meta').textContent=dateString(data.published_at);const frame=document.getElementById('article');frame.style.display='block';frame.srcdoc=`<!doctype html><html lang="ko"><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,'Apple SD Gothic Neo',sans-serif;color:#20364a;line-height:1.85;margin:0;padding:12px;overflow-wrap:anywhere}img{max-width:100%;height:auto}table{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto}td,th{border:1px solid #dce7ee;padding:9px}a{color:#147bb2}</style></head><body>${data.body_html}</body></html>`;frame.addEventListener('load',()=>{try{frame.style.height=Math.max(600,frame.contentDocument.body.scrollHeight+30)+'px'}catch{}});}};</script></body></html>
