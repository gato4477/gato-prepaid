<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가토선불폰 블로그</title><meta name="description" content="가토선불폰 개통 방법과 유심, 요금제 관련 글을 모아보세요."><style>*{box-sizing:border-box}body{margin:0;background:#f1f9ff;color:#20364a;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.shell{max-width:740px;min-height:100vh;margin:auto;background:white;padding:24px}.nav{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dbeaf5;padding-bottom:20px}.nav a{color:#167db5;text-decoration:none;font-weight:700}.tag{display:inline-block;background:#dff3ff;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:800}h1{font-size:29px;margin:20px 0 8px}.desc{color:#61768a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:24px}.card{text-decoration:none;color:inherit}.cover{aspect-ratio:4/3;background:#eaf6fd;border-radius:15px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.card h2{font-size:16px;line-height:1.5}.empty{grid-column:1/-1;background:#f3faff;border:1px dashed #b8dcf0;border-radius:15px;padding:35px 15px;text-align:center;color:#547389}@media(max-width:400px){.grid{gap:12px}.card h2{font-size:14px}}</style></head><body><main class="shell"><nav class="nav"><strong>GATO MOBILE</strong><a href="../index.html">← 홈으로</a></nav><p class="tag">04 · BLOG</p><h1>가토선불폰 블로그</h1><p class="desc">유심, 요금제, 개통 방법을 정리한 글을 확인하세요.</p><section class="grid" id="posts"><div class="empty">게시된 글이 아직 없습니다.<br>관리자 글쓰기 기능을 연결하면 최신 글이 이곳에 표시됩니다.</div></section></main><script>(async()=>{try{const r=await fetch('posts.json',{cache:'no-store'});if(!r.ok)return;const posts=(await r.json()).filter(p=>p.published!==false).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));if(!posts.length)return;const root=document.getElementById('posts');root.replaceChildren();for(const p of posts){const a=document.createElement('a');a.className='card';a.href=p.url||'#';const cover=document.createElement('div');cover.className='cover';if(p.image){const img=document.createElement('img');img.src=p.image;img.alt='';img.loading='lazy';cover.append(img)}const h=document.createElement('h2');h.textContent=p.title||'제목 없음';a.append(cover,h);root.append(a)}}catch(e){}})()</script></body></html>
