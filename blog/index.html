<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가토선불폰 블로그</title><link rel="stylesheet" href="/blog/style.css"></head><body><header><a href="/">← 가토선불폰</a><h1>가토선불폰 블로그</h1><p>휴대폰 이용 정보와 실제 사례</p></header><main><input id="post-search" type="search" placeholder="궁금한 내용을 검색해 보세요." aria-label="블로그 글 검색"><div id="post-tabs" class="post-tabs"><button class="active" data-filter="all">전체</button><button data-filter="개통">개통 방법</button><button data-filter="요금">요금제</button><button data-filter="유심">유심·단말기</button><button data-filter="사용">사용 팁</button></div><div id="status">글을 불러오는 중입니다.</div><div id="posts" class="cards"></div></main><footer><a href="/">가토선불폰 홈으로</a></footer><script type="module">import {client,ready,escapeHtml,postUrl,coverUrl,dateString} from './common.js';const status=document.getElementById('status');if(!ready){status.textContent='블로그 연결 설정이 아직 완료되지 않았습니다.'}else{const {data,error}=await client.from('blog_posts').select('slug,title,summary,cover_path,published_at').eq('published',true).order('published_at',{ascending:false});if(error)status.textContent='글을 불러올 수 없습니다: '+error.message;else{status.textContent=data.length?'':'아직 등록된 글이 없습니다.';window.__posts=data;window.renderBlog=()=>{let q=document.getElementById('post-search').value.trim().toLowerCase();let f=window.__filter||'all';let filtered=data.filter(p=>(f==='all'||(p.title+' '+p.summary).includes(f))&&(!q||(p.title+' '+p.summary).toLowerCase().includes(q)));document.getElementById('posts').innerHTML=filtered.map(p=>`<a class="post-card" href="${postUrl(p)}">${p.cover_path?`<img src="${coverUrl(p.cover_path)}" alt="">`:''}<div><h2>${escapeHtml(p.title)}</h2><p>${escapeHtml(p.summary)}</p><small>${dateString(p.published_at)}</small></div></a>`).join('');status.textContent=filtered.length?'':'검색 결과가 없습니다.'};window.renderBlog()}};</script><script>document.getElementById('post-search').addEventListener('input',()=>window.renderBlog?.());document.getElementById('post-tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;window.__filter=b.dataset.filter;document.querySelectorAll('#post-tabs button').forEach(x=>x.classList.toggle('active',x===b));window.renderBlog?.()})</script></body></html>
