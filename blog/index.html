<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가토선불폰 블로그</title><link rel="stylesheet" href="/blog/style.css"></head><body><header><a href="/">← 가토선불폰</a><h1>가토선불폰 블로그</h1><p>휴대폰 이용 정보와 실제 사례</p></header><main><div id="status">글을 불러오는 중입니다.</div><div id="posts" class="cards"></div></main><footer><a href="/admin/">관리자</a></footer><script type="module">import {client,ready,escapeHtml,postUrl,coverUrl,dateString} from './common.js';const status=document.getElementById('status');if(!ready){status.textContent='블로그 연결 설정이 아직 완료되지 않았습니다.'}else{const {data,error}=await client.from('blog_posts').select('slug,title,summary,cover_path,published_at').eq('published',true).order('published_at',{ascending:false});if(error)status.textContent='글을 불러올 수 없습니다: '+error.message;else{status.textContent=data.length?'':'아직 등록된 글이 없습니다.';document.getElementById('posts').innerHTML=data.map(p=>`<a class="post-card" href="${postUrl(p)}">${p.cover_path?`<img src="${coverUrl(p.cover_path)}" alt="">`:''}<div><h2>${escapeHtml(p.title)}</h2><p>${escapeHtml(p.summary)}</p><small>${dateString(p.published_at)}</small></div></a>`).join('')}};</script></body></html>
