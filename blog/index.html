<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가토선불폰 블로그</title><link rel="stylesheet" href="/blog/style.css"></head><body><header><a href="/">← 가토선불폰</a><h1>가토선불폰 블로그</h1><p>휴대폰 이용 정보와 실제 사례</p></header><main><input id="search" type="search" placeholder="글 검색"><p id="status">글을 불러오는 중입니다.</p><div id="posts" class="cards"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let posts=[];function render(){const q=document.getElementById('search').value.trim().toLowerCase(),filtered=posts.filter(p=>p.published&&(p.title+' '+p.summary).toLowerCase().includes(q));document.getElementById('status').textContent=filtered.length?'':'등록된 글이 없습니다.';document.getElementById('posts').innerHTML=filtered.map(p=>'<a class="post-card" href="/blog/post.html?slug='+encodeURIComponent(p.slug)+'">'+(p.cover_path?'<img src="'+encodeURI(p.cover_path)+'" alt="">':'')+'<div><h2>'+esc(p.title)+'</h2><p>'+esc(p.summary)+'</p><small>'+(p.published_at?new Date(p.published_at).toLocaleDateString('ko-KR'):'')+'</small></div></a>').join('')}fetch('/blog/posts.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{posts=d;render()}).catch(()=>document.getElementById('status').textContent='글 목록을 불러올 수 없습니다.');document.getElementById('search').addEventListener('input',render);</script></body></html>
